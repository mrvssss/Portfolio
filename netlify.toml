[build]
  command = "echo 'static site, no build step'"
  publish = "."
  publish_branch = "main"

[build.environment]
  NODE_VERSION = "20"

# Force a clean rebuild of the contact form on Netlify.
# Rebuild trigger: 2026-09-27T16:55Z

[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
  cache-control = "no-cache, no-store, must-revalidate"